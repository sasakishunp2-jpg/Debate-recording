<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Debate Audio Search</title>
    <link rel="stylesheet" href="stylesheet/style.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <py-config src="./pyscript.toml"></py-config>

</head>
<body>
<div class="container">
    <h2>Debate Explorer   OUT OF SERVICE </h2> 
    <p>Choose motion type：</p>
    <select id="category-input">
        <option value="">-- Choose motion type --</option>
        <option value="conflict">Conflict</option>
        <option value="economics">Economics</option>
        <option value="education">Education</option>
        <option value="social movement">Social Movement</option>
        <option value="imaginary situation">Imaginary Situation</option>
        <option value="law">Law</option>
        <option value="philosophy">Philosophy</option>
        <option value="narrative">Narrative</option>
        <option value="sport">Sport</option>
        <option value="technology">Technology</option>
        <option value="animal right">Animal Right</option>
        <option value="criminal justice system">Criminal Justice System</option>
        <option value="politics">Politics</option>
        <option value="religion">Religion</option>
        <option value="media">Media</option>
        <option value="culture">Culture</option>
        <option value="development">Development</option>
        <option value="environment">Environment</option>
        <option value="military">Military</option>
        <option value="international relation">International Relation</option>
        <option value="medical">Medical</option>
        <option value="artificial intelligence">Artificial Intelligence</option>
        <option value="tourism">Tourism</option>
    </select>
    <button py-click="search_videos">Search</button>

    <div id="output"></div>

 </div> 
    <script type="py">
        import csv
        from pyscript import document
        
        def search_videos(event):
            target = document.querySelector("#category-input").value.strip().lower()
            output_div = document.querySelector("#output")
            output_div.innerHTML = ""

            if not target:
                output_div.innerText = "Choose motion type."
                return

            results_found = False

            try:
                with open("newestversion.csv", mode="r", encoding="utf-8") as f:
                    # quotecharをダブルクォーテーション（デフォルト）に戻す
                    reader = csv.reader(f, skipinitialspace=True)
                    header_skip = True
                    for row in reader:
                        print(f"読み込み中: {row}")
                        if header_skip:
                            header_skip = False
                            continue

                        # 列が足りない場合はスキップ
                        if len(row) < 4:
                            continue

                        # インデックスをCSVの並びに正確に合わせる
                        video_id = row[0].strip()
                        title    = row[1].strip()
                        topic    = row[2].strip()
                        category = row[3].strip() # ここに "philosophy, culture" が入る
                        
                        # カテゴリーに対して検索を行う（複数のカテゴリーに対応）
                        if target in category.lower():
                            url = f"https://www.youtube.com/watch?v={video_id}"
                            
                            # 検索結果の表示を作成
                            result_item = f"""
                            <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
                                <h3 style="margin: 5px 0; color: #333;">{title}</h3>
                                <p style="margin: 5px 0; font-size: 0.9em; color: #666;">Motion: {topic}</p>
                                <a href="{url}" target="_blank" class="url-link">🎬 Watch debate</a>
                            </div>
                            """
                            output_div.innerHTML += result_item
                            results_found = True

            except Exception as e:
                output_div.innerText = f"Error occurred: {e}"

            if not results_found:
                output_div.innerText = f"No videos found for the motion type '{target}'."
    </script>

</body>
</html>
