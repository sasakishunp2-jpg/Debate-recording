<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Debate Audio Search</title>
    <link rel="stylesheet" href="stylesheet/style.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <py-config src="./pyscript.toml"></py-config>

</head>
<body>
<div class="container">
    <h2>ディベート音源検索ツール </h2> 
    <p>カテゴリーを選択してください：</p>
    <select id="category-input">
        <option value="">-- カテゴリーを選んでください --</option>
        <option value="conflict">Conflict</option>
        <option value="economics">Economics</option>
        <option value="education">Education</option>
        <option value="social movement">Social Movement</option>
        <option value="imaginary situation">Imaginary Situation</option>
        <option value="law">Law</option>
        <option value="philosophy">Philosophy</option>
        <option value="narrative">Narrative</option>
        <option value="sport">Sport</option>
        <option value="technology">Technology</option>
        <option value="animal right">Animal Right</option>
        <option value="criminal justice system">Criminal Justice System</option>
        <option value="politics">Politics</option>
        <option value="religion">Religion</option>
        <option value="media">Media</option>
        <option value="culture">Culture</option>
        <option value="development">Development</option>
        <option value="environment">Environment</option>
        <option value="military">Military</option>
        <option value="international relation">International Relation</option>
        <option value="medical">Medical</option>
        <option value="artificial intelligence">Artificial Intelligence</option>
        <option value="tourism">Tourism</option>
    </select>
    <button py-click="search_videos">検索</button>

    <div id="output"></div>

 </div> 
    <script type="py">
        import csv
        
        def search_videos(event):
            target = document.querySelector("#category-input").value.strip().lower()
            output_div = document.querySelector("#output")
            output_div.innerHTML = ""

            if not target:
                output_div.innerText = "カテゴリーを選択してください。"
                return

            results_found = False

            try:
                with open("debate_datatitle.csv", mode="r", encoding="utf-8") as f:
                    reader = csv.reader(f)
                    for row in reader:
                        # 4項目あるかチェック（データ不足によるエラー防止）
                        if not row or len(row) < 4: continue 

                        # CSVの並び順に合わせて番号を指定
                        video_id = row[0] # ID
                        title    = row[1] # タイトル
                        topic    = row[2] # 論題
                        category = row[3] # カテゴリー（ここで検索の判定をする）

                        # 3番目の「カテゴリー」に対して検索を行う
                        if target in category.lower():
                            url = f"https://www.youtube.com/watch?v={video_id}"
                            
                            # 検索結果の表示を作成
                            result_item = f"""
                            <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
                                <h3 style="margin: 5px 0; color: #333;">{title}</h3>
                                <p style="margin: 5px 0; font-size: 0.9em; color: #666;">論題: {topic}</p>
                                <a href="{url}" target="_blank" class="url-link">🎬 動画を視聴する</a>
                            </div>
                            """
                            output_div.innerHTML += result_item
                            results_found = True

            except Exception as e:
                output_div.innerText = f"エラーが発生しました: {e}"

            if not results_found:
                output_div.innerText = f"「{target}」に該当する動画は見つかりませんでした。"
    </script>

</body>
</html>
